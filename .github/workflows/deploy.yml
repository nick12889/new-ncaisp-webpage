name: Deploy to Cloudflare

on:
  # Auto-deploy paused until the live site's page is saved in the repo.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT || secrets.CF_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Check Cloudflare credentials are present
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::No Cloudflare API token secret found (tried CLOUDFLARE_API_TOKEN, CF_API_TOKEN, CLOUDFLARE_TOKEN, CF_TOKEN, CLOUDFLARE_API_KEY)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::No Cloudflare account ID secret found (tried CLOUDFLARE_ACCOUNT_ID, CF_ACCOUNT_ID, CLOUDFLARE_ACCOUNT, CF_ACCOUNT)"; exit 1; }
      - name: Deploy Worker
        run: npx wrangler deploy
      # Optional Worker secrets: only set when the matching GitHub secret exists.
      - name: Sync Worker secrets
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEADS_API_KEY: ${{ secrets.LEADS_API_KEY }}
          TWENTY_BASE_URL: ${{ secrets.TWENTY_BASE_URL }}
          TWENTY_API_KEY: ${{ secrets.TWENTY_API_KEY }}
        run: |
          for name in RESEND_API_KEY LEADS_API_KEY TWENTY_BASE_URL TWENTY_API_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "Skipping $name (not set in GitHub secrets)"
            fi
          done

name: Restore Cloudflare version

on:
  workflow_dispatch:
    inputs:
      version_prefix:
        description: First characters of the Cloudflare version ID to restore (from its preview URL)
        required: true
        default: e4b6d907
      preview_url:
        description: Preview URL of that version
        required: true
        default: https://e4b6d907-new-ncaisp-webpage.nishant120889-778.workers.dev/
      do_rollback:
        description: Roll the live Worker back to that version
        required: true
        default: 'true'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: Save the correct site (all pages and assets) into recovered-site/
        run: |
          cat > crawl.mjs <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const base = new URL(process.env.BASE);
          const out = 'recovered-site';
          const seen = new Set();
          const queue = ['/'];
          const exts = /\.(css|js|mjs|json|webp|png|jpe?g|gif|svg|ico|woff2?|ttf|txt|xml|webmanifest|pdf|mp4|webm)$/i;
          const attr = /(?:src|href|poster|content)=["']([^"'#]+)["']/gi;
          const cssUrl = /url\(["']?([^"')]+)["']?\)/gi;
          function local(u, from) {
            try {
              const x = new URL(u, new URL(from, base));
              if (x.origin !== base.origin) return null;
              return x.pathname;
            } catch { return null; }
          }
          while (queue.length) {
            const p = queue.shift();
            if (seen.has(p)) continue;
            seen.add(p);
            const r = await fetch(new URL(p, base));
            if (!r.ok) { console.log('skip', p, r.status); continue; }
            const type = r.headers.get('content-type') || '';
            let file = p.endsWith('/') ? p + 'index.html' : p;
            if (!path.extname(file)) file += '/index.html';
            const dest = path.join(out, file);
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            const buf = Buffer.from(await r.arrayBuffer());
            fs.writeFileSync(dest, buf);
            console.log('saved', p, '->', dest);
            if (/html|css|javascript/.test(type) || /\.(html|css|js)$/.test(file)) {
              const text = buf.toString('utf8');
              for (const re of [attr, cssUrl]) {
                re.lastIndex = 0;
                let m;
                while ((m = re.exec(text))) {
                  const lp = local(m[1], p);
                  if (!lp || lp.startsWith('/api/')) continue;
                  if (lp.endsWith('/') || exts.test(lp)) queue.push(lp);
                }
              }
            }
          }
          console.log('total', seen.size);
          JS
          BASE="${{ inputs.preview_url }}" node crawl.mjs
          rm crawl.mjs
          find recovered-site -type f | sort

      - name: Commit recovered files to a branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b recovered-site
          git add recovered-site
          git commit -m "Save correct live page (version ${{ inputs.version_prefix }}) into the repo"
          git push -f origin recovered-site

      - name: Find full version ID
        id: ver
        run: |
          npx wrangler versions list --json > versions.json
          id=$(node -e "const v=JSON.parse(require('fs').readFileSync('versions.json','utf8'));const m=v.find(x=>x.id.startsWith('${{ inputs.version_prefix }}'));if(!m){console.error('not found');process.exit(1)}console.log(m.id)")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Version: $id"

      - name: Roll back
        if: ${{ inputs.do_rollback == 'true' }}
        run: npx wrangler rollback "${{ steps.ver.outputs.id }}" --message "Restore correct page" -y
